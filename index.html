<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wordline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,560;7..72,700&family=Outfit:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #09090b;
        color: #f4f1ea;
        font-family: Outfit, sans-serif;
      }
      main {
        width: min(36rem, calc(100% - 2rem));
        margin: 0 auto;
        padding: 4.5rem 0 3rem;
      }
      p.mark {
        margin: 0;
        color: #8b87ff;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.3rem 0 1.4rem;
        font-family: Literata, serif;
        font-size: clamp(3.4rem, 10vw, 5.5rem);
        font-weight: 560;
        letter-spacing: -0.05em;
        line-height: 0.9;
      }
      label { display: block; margin: 1rem 0 0.35rem; color: #a39e96; font-size: 0.8rem; }
      input {
        width: 100%;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      #address {
        border-bottom: 1px solid #3a3834;
        padding: 0.4rem 0;
        font-size: 0.85rem;
      }
      #word {
        margin-top: 1.2rem;
        padding: 0.2rem 0 0.45rem;
        border-bottom: 3px solid #8b87ff;
        font-family: Literata, serif;
        font-size: 2.4rem;
      }
      input:focus { outline: none; }
      .bar { display: flex; gap: 0.6rem; align-items: center; margin-top: 1.2rem; }
      button {
        border: 0;
        cursor: pointer;
        font: inherit;
      }
      #connect, #read {
        height: 2.2rem;
        padding: 0 0.8rem;
        background: transparent;
        color: #d8d4cc;
        border-bottom: 1px solid #5c5852;
      }
      #submit {
        margin-left: auto;
        height: 2.7rem;
        padding: 0 1rem;
        background: #8b87ff;
        color: #120f2e;
        font-weight: 500;
      }
      #wallet, #error { color: #a39e96; font-size: 0.8rem; word-break: break-all; }
      #error { color: #ff8f80; }
      #status { color: #8b87ff; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; }
      article {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid #2a2926;
      }
      #part { margin: 0; color: #8b87ff; font-style: italic; }
      #definition {
        margin: 0.4rem 0 0;
        font-family: Literata, serif;
        font-size: 1.45rem;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mark">Dictionary on Studionet</p>
      <h1>Wordline</h1>
      <label for="address">Contract</label>
      <input id="address" value="0xCC8E856FC52014F25Ab92Cc4044651999996dfAc" autocomplete="off" />
      <label for="word">One word</label>
      <input id="word" maxlength="20" placeholder="consensus" autocomplete="off" />
      <div class="bar">
        <button id="connect" type="button">Connect</button>
        <button id="read" type="button">Saved</button>
        <button id="submit" type="button">Look up</button>
      </div>
      <p id="wallet"></p>
      <p id="status">idle</p>
      <p id="error"></p>
      <article>
        <p id="part"></p>
        <p id="definition"></p>
      </article>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
